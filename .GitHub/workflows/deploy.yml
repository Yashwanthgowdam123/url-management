name: Build, Scan and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: url-inventory
  TRIVY_VERSION: 0.69.3       # known-safe release; bump deliberately after checking release notes
  VULN_THRESHOLD: 10          # deployment is cancelled if vulnerabilities > this
  APP_DIR: /opt/url-inventory

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .

      - name: Trivy scan (HIGH + CRITICAL, JSON report)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/out \
            ghcr.io/aquasecurity/trivy:${{ env.TRIVY_VERSION }} image \
            --severity HIGH,CRITICAL --ignore-unfixed --list-all-pkgs \
            --format json --output /out/trivy-report.json \
            --exit-code 0 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Show Trivy report in job summary
        if: always()
        run: |
          if [ ! -s trivy-report.json ]; then
            echo "No Trivy report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker run --rm -v "$PWD":/out \
            ghcr.io/aquasecurity/trivy:${{ env.TRIVY_VERSION }} convert \
            --format table --output /out/trivy-report.txt /out/trivy-report.json
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-report.json)
          if [ "$COUNT" -gt "$VULN_THRESHOLD" ]; then STATUS="❌ FAILED - deployment cancelled"; else STATUS="✅ PASSED"; fi
          {
            echo "## Trivy scan: $IMAGE_NAME"
            echo ""
            echo "**Fixable HIGH/CRITICAL vulnerabilities:** $COUNT (limit: $VULN_THRESHOLD) - $STATUS"
            echo ""
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce vulnerability threshold
        run: |
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-report.json)
          echo "Vulnerabilities found (HIGH/CRITICAL, fixable): $COUNT (limit: $VULN_THRESHOLD)"
          if [ "$COUNT" -gt "$VULN_THRESHOLD" ]; then
            echo "::error::$COUNT vulnerabilities exceed the limit of $VULN_THRESHOLD. Deployment cancelled."
            exit 1
          fi

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-report.json
            trivy-report.txt

      - name: Prepare SSH
        run: |
          for v in VM_HOST VM_USER VM_SSH_KEY; do
            eval "val=\${$v}"
            [ -n "$val" ] || { echo "::error::Secret $v is empty or missing"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/vm.pem
          chmod 600 ~/.ssh/vm.pem
          ssh-keyscan -T 20 -H "$VM_HOST" >> ~/.ssh/known_hosts 2>keyscan.err
          if ! [ -s ~/.ssh/known_hosts ]; then
            echo "::error::Cannot reach $VM_HOST on port 22 from GitHub runner. Check VM_HOST and that the VM firewall/security group allows inbound TCP 22."
            cat keyscan.err
            exit 1
          fi
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}

      - name: Copy compose file and prepare .env on VM
        run: |
          SSH="ssh -i ~/.ssh/vm.pem ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}"
          $SSH "mkdir -p $APP_DIR"
          scp -i ~/.ssh/vm.pem docker-compose.yml Caddyfile ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:$APP_DIR/
          # Fixed values are sent over stdin; the VM keeps its existing SECRET_KEY or generates one on first deploy
          printf 'IMAGE_TAG=latest\nADMIN_USER=%s\nADMIN_PASSWORD=%s\n' \
            "${{ secrets.ADMIN_USER }}" "${{ secrets.ADMIN_PASSWORD }}" \
            | $SSH 'cd '"$APP_DIR"' && umask 077 \
                && KEY=$(grep "^SECRET_KEY=" .env 2>/dev/null || echo "SECRET_KEY=$(openssl rand -hex 32)") \
                && { cat; echo "$KEY"; } > .env.new && mv .env.new .env'

      - name: Ship image and (re)start container
        run: |
          SSH="ssh -i ~/.ssh/vm.pem ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}"
          docker save $IMAGE_NAME:latest | gzip | $SSH "gunzip | docker load"
          $SSH "cd $APP_DIR && docker compose up -d --remove-orphans && docker image prune -f"

      - name: Verify
        run: |
          ssh -i ~/.ssh/vm.pem ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "sleep 8 && docker ps --filter name=url-inventory --format '{{.Names}}  {{.Status}}'"

      - name: Cleanup key
        if: always()
        run: rm -f ~/.ssh/vm.pem
