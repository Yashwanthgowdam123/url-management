services:
  web:
    image: url-inventory:${IMAGE_TAG:-latest}
    container_name: url-inventory
    restart: always
    expose:
      - "8000"
    environment:
      DB_PATH: /data/urls.db
      COOKIE_SECURE: "true"
      ADMIN_USER: ${ADMIN_USER:?set ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
    volumes:
      - url_data:/data

  backup:
    image: url-inventory:${IMAGE_TAG:-latest}
    container_name: url-inventory-backup
    restart: always
    command: ["python", "backup.py"]
    environment:
      DB_PATH: /data/urls.db
      BACKUP_KEEP: "14"
      BACKUP_INTERVAL_HOURS: "24"
    volumes:
      - url_data:/data
      - url_backups:/backups
    depends_on:
      - web

  caddy:
    image: caddy:2-alpine
    container_name: url-inventory-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-myurls.yashwanthgowdam.in}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  url_data:
    name: url_inventory_data
  url_backups:
    name: url_inventory_backups
  caddy_data:
  caddy_config:
